[project]
name = "nexashop-recsys"
version = "0.1.0"
description = "Hybrid AI e-commerce recommendation system (CBF + CF + ARM)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "mlxtend>=0.23",
    "vaderSentiment>=3.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
